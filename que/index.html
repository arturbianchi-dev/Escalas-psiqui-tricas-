<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Que?</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111318}body{display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.stage{width:100%;height:100%;display:grid;place-items:center;padding:18px}.sticker{width:min(100vw,100vh,576px);aspect-ratio:576/555;position:relative;filter:drop-shadow(0 18px 45px #0008);transition:transform .12s ease}.sticker img{width:100%;height:100%;object-fit:contain;display:block}.sticker:active{transform:scale(.975)}svg{width:100%;height:100%;display:block}.word{font-family:Arial,sans-serif;font-weight:800;font-size:76px;fill:white;paint-order:stroke;stroke:#ffffff22;stroke-width:1px}.hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffffff65;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.pop{animation:pop .28s ease}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.sticker,.pop{animation:none;transition:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Figurinha interativa. Toque para ouvir que.">
<div class="sticker" id="sticker">
<img src="./dog.jpg" alt="A figurinha original do cachorro com a palavra que" />
</div>
</main>
<div class="hint">toque em qualquer lugar</div>
<script>
const sticker=document.getElementById('sticker');
function sayQue(){
  sticker.classList.remove('pop'); void sticker.offsetWidth; sticker.classList.add('pop');
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const voice=new SpeechSynthesisUtterance('que');
  voice.lang='pt-BR'; voice.rate=0.88; voice.pitch=1.08;
  window.speechSynthesis.speak(voice);
}
document.body.addEventListener('click',sayQue);
document.body.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();sayQue()}});
</script>
</body>
</html>
