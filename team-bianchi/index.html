<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101012"><title>Team Bianchi — Entrar</title><style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#161619;--line:#303036;--red:#f02b3b;--muted:#a5a5ad;--white:#f7f7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#2b1015 0%,#0b0b0d 55%);color:var(--white);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:18px}button,input{font:inherit}.card{width:min(100%,440px);border:1px solid var(--line);background:#151518;border-radius:20px;padding:25px;box-shadow:0 20px 80px #0008}.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.logo{background:linear-gradient(135deg,#ff4b57,#a90015);border-radius:13px;padding:12px;font-weight:900}.eyebrow{color:#ff626c;font-size:10px;letter-spacing:2px;font-weight:800}.brand h1{margin:0;font-size:22px}.muted{color:var(--muted)}h2{margin:0 0 5px;font-size:23px}.sub{margin:0 0 20px;color:var(--muted)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0c0c0e;padding:5px;border-radius:10px;margin-bottom:20px}.modes button,.secondary{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:7px;padding:9px 4px;cursor:pointer;font-size:12px}.modes button.active{background:#3c141a;color:white;border-color:#69212a}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:#c6c6cc;font-weight:700}.field input{width:100%;background:#0b0b0d;border:1px solid var(--line);border-radius:9px;padding:12px;color:white}.primary{width:100%;background:var(--red);border:1px solid var(--red);border-radius:9px;padding:12px;color:white;font-weight:800;margin-top:10px;cursor:pointer}.secondary{width:100%;border-color:var(--line);font-size:13px;margin-top:10px}.message{padding:11px;border-radius:9px;background:#242428;margin:12px 0;font-size:13px;overflow-wrap:anywhere}.message.error{background:#39171c;color:#ffc1c5}.message.ok{background:#152b20;color:#baf5ce}.foot{font-size:11px;color:#777;margin-top:20px}.hidden{display:none!important}a{color:#ff737c}</style></head><body><main class="card"><header class="brand"><div class="logo">TB</div><div><div class="eyebrow">PERFORMANCE COACHING</div><h1>TEAM BIANCHI</h1><div class="muted">Treino • Nutrição • Evolução</div></div></header><h2 id="heading">Bem-vindo de volta.</h2><p class="sub" id="subheading">Entre para acessar seu plano.</p><div class="modes"><button class="active" data-mode="login">Login</button><button data-mode="signup">Cadastro</button><button data-mode="admin">Administrador</button></div><form id="authForm"><div class="field hidden" id="nameField"><label for="fullName">Nome completo</label><input id="fullName" autocomplete="name" placeholder="Seu nome"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo de 8 caracteres"></div><button class="primary" id="submitBtn">Entrar</button></form><button class="secondary" id="forgotBtn">Esqueci minha senha</button><div id="notice" class="message hidden" role="status"></div><p class="foot">A confirmação de e-mail é necessária para ativar novas contas. Contas de administrador precisam ser autorizadas pelo responsável do sistema.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const client=window.teamBianchiSupabase;let mode='login';const $=id=>document.getElementById(id);function notice(t,type='ok'){$('notice').textContent=t;$('notice').className='message '+type}function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('nameField').classList.toggle('hidden',m!=='signup'&&m!=='admin');$('heading').textContent=m==='login'?'Bem-vindo de volta.':m==='signup'?'Crie sua conta.':'Acesso da equipe.';$('subheading').textContent=m==='login'?'Entre para acessar seu plano.':m==='signup'?'Cadastre-se e confirme seu e-mail.':'Entre com a conta de administrador autorizada.';$('submitBtn').textContent=m==='login'?'Entrar':m==='signup'?'Criar conta':'Entrar como administrador';$('forgotBtn').classList.toggle('hidden',m!=='login');$('password').autocomplete=m==='login'?'current-password':'new-password';$('notice').className='message hidden'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('authForm').onsubmit=async e=>{e.preventDefault();if(!client){notice('Falta configurar o projeto Supabase em supabase-config.js. Veja o README de configuração.','error');return}const email=$('email').value.trim().toLowerCase(),password=$('password').value,full_name=$('fullName').value.trim();$('submitBtn').disabled=true;try{if(mode==='signup'||mode==='admin'){if(password.length<8)throw Error('A senha deve ter pelo menos 8 caracteres.');const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name,requested_role:mode==='admin'?'admin':'user'},emailRedirectTo:new URL('./index.html',location.href).href}});if(error)throw error;if(data.user){await client.from('profiles').upsert({id:data.user.id,full_name,role:'user'});notice(mode==='admin'?'Cadastro recebido. A conta ficará como usuário comum até o responsável autorizar o perfil de administrador. Confirme o e-mail enviado.':'Conta criada. Abra o link enviado para seu e-mail para confirmar a conta e depois entre.')}}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;const {data:profile,error:pe}=await client.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!data.user.email_confirmed_at)throw Error('Confirme seu e-mail pelo link enviado antes de entrar.');if(mode==='admin'&&profile?.role!=='admin'){await client.auth.signOut();throw Error('Esta conta ainda não tem permissão de administrador.');}if(mode!=='admin'&&profile?.role==='admin'){location.href='./app.html';return}location.href='./app.html'}}catch(err){notice(err.message||'Não foi possível concluir a operação.','error')}finally{$('submitBtn').disabled=false}};$('forgotBtn').onclick=async()=>{if(!client){notice('Configure primeiro o Supabase.','error');return}const email=$('email').value.trim();if(!email){notice('Digite seu e-mail acima para receber o link de recuperação.','error');return}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:new URL('./index.html',location.href).href});notice(error?error.message:'Se o endereço estiver cadastrado, você receberá um link de recuperação. ',error?'error':'ok')};if(client)client.auth.getSession().then(({data})=>{if(data.session)location.href='./app.html'});
</script></body></html>
