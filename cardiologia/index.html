<script>
const D=[
{id:'chads',n:'CHA₂DS₂-VASc',c:'Risco e prevenção',d:'Risco tromboembólico na fibrilação atrial.',u:'https://www.escardio.org/Guidelines',f:[['age','Idade','num',70,0,120],['sex','Sexo na versão clássica','sel','m',['m|Masculino','f|Feminino']],['hf','Insuficiência cardíaca/disfunção ventricular','check'],['htn','Hipertensão','check'],['dm','Diabetes','check'],['stroke','AVC/AIT/embolia sistêmica prévia (2 pontos)','check'],['vasc','Doença vascular (IAM/DAP/placa aórtica)','check']],x:v=>{let s=(v.hf?1:0)+(v.htn?1:0)+(v.dm?1:0)+(v.stroke?2:0)+(v.vasc?1:0)+(v.age>=75?2:v.age>=65?1:0)+(v.sex==='f'?1:0);return [s+'/9',s===0?'Menor pontuação na versão clássica':s>=2?'Pontuação ≥2: avaliar anticoagulação conforme diretriz':'Pontuação 1: individualizar risco e benefício','Sexo feminino é modificador de risco em diretrizes contemporâneas, não indicação isolada. Avalie sangramento, função renal e preferências.']}},
{id:'hasbled',n:'HAS-BLED',c:'Risco e prevenção',d:'Fatores de risco para sangramento na fibrilação atrial.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=HAS-BLED+score',f:[['h','Hipertensão não controlada','check'],['r','Disfunção renal','check'],['l','Disfunção hepática','check'],['s','AVC prévio','check'],['b','Sangramento prévio/predisposição','check'],['i','INR lábil (antagonista da vitamina K)','check'],['a','Idade >65 anos','check'],['d','Antiagregante/AINE concomitante','check'],['al','Uso excessivo de álcool','check']],x:v=>{let s=Object.values(v).filter(Boolean).length;return[s+'/9',s>=3?'Risco elevado: revisar fatores modificáveis':'Pontuação '+s,'Escore elevado não é, isoladamente, motivo para negar anticoagulação.']}},
{id:'heart',n:'HEART Score',c:'Síndrome coronariana',d:'Estratificação de pacientes com dor torácica na emergência.',u:'https://www.mdcalc.com/calc/384/heart-score-major-cardiac-events',f:[['h','História clínica','sel','1',['0|Pouco suspeita (0)','1|Moderadamente suspeita (1)','2|Altamente suspeita (2)']],['e','ECG','sel','0',['0|Normal (0)','1|Alterações inespecíficas (1)','2|Desvio significativo de ST (2)']],['a','Idade','sel','0',['0|<45 anos (0)','1|45–64 anos (1)','2|≥65 anos (2)']],['r','Fatores de risco/DAC conhecida','sel','0',['0|Nenhum fator (0)','1|1–2 fatores (1)','2|≥3 fatores ou aterosclerose conhecida (2)']],['t','Troponina','sel','0',['0|≤ limite superior normal (0)','1|1–3× limite (1)','2|>3× limite (2)']]],x:v=>{let s=+v.h+ +v.e+ +v.a+ +v.r+ +v.t;return[s+'/10',s<=3?'HEART 0–3: menor risco na coorte original':s<=6?'HEART 4–6: risco intermediário':'HEART 7–10: risco maior','Não use isoladamente para alta. Interprete com ECG, troponinas seriadas e protocolo local.']}},
{id:'timi',n:'TIMI — SCA sem supra',c:'Síndrome coronariana',d:'Sete variáveis prognósticas em angina instável/IAM sem supra.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=TIMI+risk+score+unstable+angina',f:[['a','Idade ≥65 anos','check'],['b','≥3 fatores de risco para DAC','check'],['c','DAC conhecida ≥50%','check'],['d','AAS nos últimos 7 dias','check'],['e','≥2 episódios de angina em 24 h','check'],['f','Desvio de ST ≥0,5 mm','check'],['g','Marcadores cardíacos elevados','check']],x:v=>{let s=Object.values(v).filter(Boolean).length;return[s+'/7',s<=2?'Faixa menor do TIMI':s<=4?'Faixa intermediária do TIMI':'Faixa maior do TIMI','Não substitui avaliação clínica, ECG/troponina seriados nem diretriz de SCA.']}},
{id:'grace',n:'GRACE — SCA (escore clássico)',c:'Síndrome coronariana',d:'Escore clássico GRACE 1.0 para mortalidade intra-hospitalar em síndrome coronariana aguda.',u:'https://pubmed.ncbi.nlm.nih.gov/10979111/',f:[['age','Idade (anos)','num',60,18,120],['hr','Frequência cardíaca (bpm)','num',80,20,300],['sbp','Pressão sistólica (mmHg)','num',120,30,300],['cr','Creatinina (mg/dL)','num',1,0.1,20],['killip','Classe Killip','sel','1',['1|I (0 pontos)','2|II (+20)','3|III (+39)','4|IV (+59)']],['arrest','Parada cardíaca na apresentação','check'],['marker','Marcador cardíaco elevado','check'],['st','Desvio de ST','check']],x:v=>{let a=v.age<30?0:v.age<40?8:v.age<50?25:v.age<60?41:v.age<70?58:v.age<80?75:v.age<90?91:100;let h=v.hr<50?0:v.hr<70?3:v.hr<90?9:v.hr<110?15:v.hr<150?24:v.hr<200?38:46;let p=v.sbp<80?58:v.sbp<100?53:v.sbp<120?43:v.sbp<140?34:v.sbp<160?24:v.sbp<200?10:0;let c=v.cr<.4?1:v.cr<.8?4:v.cr<1.2?7:v.cr<1.6?10:v.cr<2?13:v.cr<4?21:28;let s=a+h+p+c+({1:0,2:20,3:39,4:59}[v.killip]||0)+(v.arrest?39:0)+(v.marker?14:0)+(v.st?28:0);return[s+' pontos','GRACE clássico — escore intra-hospitalar','Modelo histórico de pontos (não é GRACE 2.0). A probabilidade depende do desfecho e da calibração original; não interpretar como porcentagem direta.'] }},
{id:'killip',n:'Killip-Kimball',c:'Síndrome coronariana',d:'Classificação clínica de insuficiência cardíaca no IAM.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Killip+Kimball+classification',f:[['k','Achados clínicos','sel','1',['1|I — sem sinais de IC','2|II — estertores, B3 ou pressão jugular elevada','3|III — edema agudo de pulmão','4|IV — choque cardiogênico']]],x:v=>[['','Classe I','Classe II','Classe III','Classe IV'][v.k]||'Classe '+v.k,['','Sem sinais de IC','Sinais de IC','Edema agudo de pulmão','Choque cardiogênico'][v.k],'Classe III/IV exige manejo emergencial.']},
{id:'rcri',n:'RCRI / Lee',c:'Cirurgia cardiovascular',d:'Índice de risco cardíaco revisado para cirurgia não cardíaca.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Revised+Cardiac+Risk+Index',f:[['s','Cirurgia de alto risco (intraperitoneal, intratorácica ou vascular suprainguinal)','check'],['ihd','Doença isquêmica cardíaca','check'],['hf','Insuficiência cardíaca','check'],['cvd','Doença cerebrovascular','check'],['ins','Diabetes em uso de insulina','check'],['cr','Creatinina >2,0 mg/dL','check']],x:v=>{let s=Object.values(v).filter(Boolean).length;return[s+'/6',s===0?'Classe I':s===1?'Classe II':s===2?'Classe III':'Classe IV','Estimativa de risco perioperatório; integre tipo de cirurgia, capacidade funcional, urgência e diretrizes atuais.']}},
{id:'dapt',n:'DAPT Score',c:'Risco e prevenção',d:'Auxilia discussão de prolongamento da dupla antiagregação após 12 meses, em pacientes selecionados.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=DAPT+score',f:[['age','Idade','sel','2',['2|<65 anos (+2)','1|65–74 anos (+1)','0|≥75 anos (0)']],['dm','Diabetes','check'],['mi','IAM prévio/apresentação com IAM','check'],['smoke','Tabagismo atual','check'],['small','Stent <3 mm','check'],['pac','ICP/IM prévia','check'],['chf','IC ou FEVE <30%','check'],['vein','Stent em enxerto venoso','check'],['pvd','Doença vascular periférica','check']],x:v=>{let s=+v.age+(v.dm?1:0)+(v.mi?1:0)+(v.smoke?1:0)+(v.small?1:0)+(v.pac?1:0)+(v.chf?2:0)+(v.vein?2:0)+(v.pvd?1:0);return[s+' pontos',s>=2?'Pode favorecer considerar DAPT prolongada':'Pode não favorecer DAPT prolongada','Aplicável em contexto específico após 12 meses sem eventos; não decide sozinho e não se aplica a todos os pacientes.']}},
{id:'qtc',n:'QT corrigido (QTc)',c:'Arritmias',d:'Calcula QTc por Bazett e Fridericia a partir do QT e RR/FC.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=QT+interval+correction+Fridericia+Bazett',f:[['qt','QT medido (ms)','num',400,100,800],['hr','Frequência cardíaca (bpm)','num',75,20,250]],x:v=>{let rr=60/v.hr,q=v.qt/1000,b=q/Math.sqrt(rr)*1000,f=q/Math.cbrt(rr)*1000;return['Bazett '+Math.round(b)+' ms · Fridericia '+Math.round(f)+' ms',b>=500||f>=500?'QTc ≥500 ms: revisar fatores de risco e fármacos':'Compare com sexo, método e contexto','Bazett pode supercorrigir em taquicardia e subcorrigir em bradicardia. Confirme a medida no ECG.']}},
{id:'wellspe',n:'Wells — embolia pulmonar',c:'Tromboembolismo',d:'Probabilidade pré-teste de embolia pulmonar.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Wells+criteria+pulmonary+embolism',f:[['dvt','Sinais clínicos de TVP','check',3],['alt','EP mais provável que diagnóstico alternativo','check',3],['hr','FC >100 bpm','check',1.5],['imm','Imobilização ≥3 dias ou cirurgia recente','check',1.5],['prev','TVP/EP prévia','check',1.5],['hem','Hemoptise','check',1],['cancer','Câncer ativo','check',1]],x:v=>{let s=(v.dvt?3:0)+(v.alt?3:0)+(v.hr?1.5:0)+(v.imm?1.5:0)+(v.prev?1.5:0)+(v.hem?1:0)+(v.cancer?1:0);return[s+' pontos',s>4?'EP provável (modelo de 2 níveis)':'EP improvável (modelo de 2 níveis)','Use o algoritmo local com D-dímero/imagem; instabilidade hemodinâmica muda a abordagem.']}},
{id:'wellsdvt',n:'Wells — TVP',c:'Tromboembolismo',d:'Probabilidade clínica de trombose venosa profunda.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Wells+criteria+deep+vein+thrombosis',f:[['c','Câncer ativo','check',1],['p','Paralisia/paresia ou imobilização gessada','check',1],['bed','Acamado ≥3 dias/cirurgia recente','check',1],['t','Dor no trajeto venoso profundo','check',1],['sw','Perna inteira edemaciada','check',1],['calf','Panturrilha ≥3 cm maior','check',1],['ed','Edema depressível unilateral','check',1],['col','Veias colaterais superficiais','check',1],['prev','TVP prévia','check',1],['alt','Diagnóstico alternativo tão provável','check',-2]],x:v=>{let s=(v.c?1:0)+(v.p?1:0)+(v.bed?1:0)+(v.t?1:0)+(v.sw?1:0)+(v.calf?1:0)+(v.ed?1:0)+(v.col?1:0)+(v.prev?1:0)-(v.alt?2:0);return[s+' pontos',s>=2?'TVP provável (2 níveis)':'TVP improvável (2 níveis)','Oriente investigação com D-dímero e ultrassonografia conforme protocolo; escore isolado não exclui TVP.']}},
{id:'perc',n:'PERC',c:'Tromboembolismo',d:'Regra de exclusão de EP somente quando a probabilidade clínica já é muito baixa.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=PERC+rule+pulmonary+embolism',f:[['a','Idade ≥50 anos','check'],['b','FC ≥100 bpm','check'],['c','SpO₂ <95%','check'],['d','Hemoptise','check'],['e','Uso de estrogênio','check'],['f','TVP/EP prévia','check'],['g','Cirurgia/trauma recente com internação','check'],['h','Edema unilateral de membro inferior','check']],x:v=>{let s=Object.values(v).filter(Boolean).length;return[s+'/8 critérios positivos',s===0?'PERC negativo em paciente apropriadamente selecionado':'PERC positivo: não exclui EP','Não usar em risco moderado/alto nem como ferramenta isolada.']}},
{id:'spesi',n:'sPESI',c:'Tromboembolismo',d:'Estratificação prognóstica em embolia pulmonar confirmada.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=simplified+PESI',f:[['a','Idade >80 anos','check'],['b','Câncer','check'],['c','Doença cardiopulmonar crônica','check'],['d','FC ≥110 bpm','check'],['e','PAS <100 mmHg','check'],['f','SpO₂ <90%','check']],x:v=>{let s=Object.values(v).filter(Boolean).length;return[s+' ponto(s)',s===0?'sPESI = 0: menor risco clínico':'sPESI ≥1: risco aumentado','Alta exige avaliação completa, incluindo VD, biomarcadores, suporte e protocolo.']}},
{id:'abcdn',n:'ABCD² — AIT',c:'Neurologia cardiovascular',d:'Estratificação de risco precoce após ataque isquêmico transitório; não exclui AVC.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=ABCD2+score+TIA',f:[['age','Idade ≥60 anos','check',1],['bp','PA ≥140/90 mmHg','check',1],['dur','Duração dos sintomas','sel','1',['0|<10 min (0)','1|10–59 min (1)','2|≥60 min (2)']],['dm','Diabetes','check',1],['clin','Manifestação clínica','sel','0',['0|Outros sintomas (0)','1|Alteração da fala sem fraqueza (1)','2|Fraqueza unilateral (2)']]],x:v=>{let s=(v.age?1:0)+(v.bp?1:0)+ +v.dur+(v.dm?1:0)+ +v.clin;return[s+'/7','ABCD² '+s,'Não deve atrasar avaliação urgente de AIT/AVC nem substituir imagem e avaliação especializada.']}},
{id:'nyha',n:'Classe funcional NYHA',c:'Classificação clínica',d:'Limitação funcional por sintomas de insuficiência cardíaca.',u:'https://www.heart.org/en/health-topics/heart-failure',f:[['k','Limitação','sel','1',['1|I — sem limitação habitual','2|II — leve limitação','3|III — limitação importante','4|IV — sintomas em repouso']]],x:v=>[['','NYHA I','NYHA II','NYHA III','NYHA IV'][v.k],'Classe funcional selecionada','Integrar com exame, ecocardiograma, biomarcadores e evolução clínica.']},
{id:'ccs',n:'Angina — CCS',c:'Classificação clínica',d:'Classificação da limitação por angina.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Canadian+Cardiovascular+Society+angina+classification',f:[['k','Atividade que desencadeia sintomas','sel','1',['1|CCS I — esforço intenso/prolongado','2|CCS II — leve limitação habitual','3|CCS III — limitação marcada','4|CCS IV — repouso ou qualquer atividade']]],x:v=>[['','CCS I','CCS II','CCS III','CCS IV'][v.k],'Classe de angina','Dor torácica nova, em repouso ou prolongada requer avaliação urgente.']},
{id:'bsa',n:'Superfície corporal — Mosteller',c:'Hemodinâmica e fórmulas',d:'Superfície corporal estimada a partir de peso e altura.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Mosteller+formula+body+surface+area',f:[['w','Peso (kg)','num',70,1,350],['h','Altura (cm)','num',170,30,250]],x:v=>{let s=Math.sqrt(v.w*v.h/3600);return[s.toFixed(2)+' m²','Superfície corporal estimada','Fórmula de Mosteller.']}},
{id:'map',n:'Pressão arterial média (PAM)',c:'Hemodinâmica e fórmulas',d:'Estimativa convencional da pressão arterial média.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=mean+arterial+pressure+formula',f:[['s','PAS (mmHg)','num',120,30,300],['d','PAD (mmHg)','num',80,10,200]],x:v=>[((v.s+2*v.d)/3).toFixed(1)+' mmHg','PAM = (PAS + 2 × PAD) / 3','É uma aproximação; considere medida invasiva e contexto hemodinâmico quando indicados.']},
{id:'crcl',n:'Clearance — Cockcroft–Gault',c:'Hemodinâmica e fórmulas',d:'Estimativa do clearance de creatinina para contextos em que essa fórmula é indicada.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Cockcroft+Gault+creatinine+clearance',f:[['a','Idade (anos)','num',65,18,110],['w','Peso usado (kg)','num',70,20,300],['cr','Creatinina (mg/dL)','num',1,0.1,20],['sex','Fator clássico','sel','m',['m|Masculino ×1,00','f|Feminino ×0,85']]],x:v=>[((140-v.a)*v.w/(72*v.cr)*(v.sex==='f'?.85:1)).toFixed(1)+' mL/min','Clearance estimado','Escolha do peso exige cuidado em obesidade/edema; não é apropriado em creatinina não estacionária.']},
{id:'ldl',n:'LDL-C — Friedewald',c:'Hemodinâmica e fórmulas',d:'Estima LDL-colesterol em mg/dL.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Friedewald+equation+LDL+cholesterol',f:[['tc','Colesterol total (mg/dL)','num',180,20,1000],['hdl','HDL (mg/dL)','num',50,1,300],['tg','Triglicerídeos (mg/dL)','num',120,1,3000]],x:v=>{let s=v.tc-v.hdl-v.tg/5;return[s.toFixed(1)+' mg/dL',v.tg>=400?'TG ≥400: Friedewald não recomendado':'LDL estimado por Friedewald','Menor precisão com triglicerídeos elevados e LDL muito baixo; considere método alternativo.']}},
{id:'bmi',n:'Índice de massa corporal',c:'Hemodinâmica e fórmulas',d:'IMC para adultos.',u:'https://www.who.int/data/gho/data/themes/topics/topic-details/GHO/body-mass-index',f:[['w','Peso (kg)','num',70,1,350],['h','Altura (cm)','num',170,30,250]],x:v=>{let s=v.w/Math.pow(v.h/100,2);return[s.toFixed(1)+' kg/m²',s<18.5?'Baixo peso':s<25?'Faixa de referência':s<30?'Sobrepeso':'Obesidade pelo IMC','Categorias convencionais para adultos; considerar composição corporal e contexto.']}},
{id:'ef',n:'Fração de ejeção (FE)',c:'Hemodinâmica e fórmulas',d:'Calcula FE a partir dos volumes diastólico e sistólico finais.',u:'https://www.asecho.org/',f:[['edv','Volume diastólico final (mL)','num',120,1,1000],['esv','Volume sistólico final (mL)','num',50,0,1000]],x:v=>{let s=(v.edv-v.esv)/v.edv*100;return[s.toFixed(1)+'%',s<40?'FE reduzida':s<=49?'FE levemente reduzida':'FE preservada/limítrofe conforme contexto','A interpretação depende da técnica, qualidade do exame e diretriz. Volumes devem ser coerentes (VDF ≥ VSF).']}},
{id:'co',n:'Débito cardíaco e índice cardíaco',c:'Hemodinâmica e fórmulas',d:'Calcula débito cardíaco por FC × volume sistólico e índice por superfície corporal.',u:'https://www.ncbi.nlm.nih.gov/books/NBK470455/',f:[['hr','Frequência cardíaca (bpm)','num',75,20,250],['sv','Volume sistólico (mL)','num',70,5,250],['bsa','Superfície corporal (m²)','num',1.8,0.3,4]],x:v=>{let co=v.hr*v.sv/1000;return[co.toFixed(2)+' L/min · IC '+(co/v.bsa).toFixed(2)+' L/min/m²','Débito e índice estimados','O volume sistólico informado deve vir de medição confiável; não é medido automaticamente.']}},
{id:'svr',n:'Resistência vascular sistêmica',c:'Hemodinâmica e fórmulas',d:'Calcula RVS com pressão média, pressão atrial direita e débito cardíaco.',u:'https://www.ncbi.nlm.nih.gov/books/NBK470455/',f:[['map','PAM (mmHg)','num',80,10,250],['rap','Pressão atrial direita/CVP (mmHg)','num',5,0,50],['co','Débito cardíaco (L/min)','num',5,0.1,30]],x:v=>[((v.map-v.rap)*80/v.co).toFixed(0)+' dyn·s·cm⁻⁵','RVS estimada','Requer medidas hemodinâmicas válidas e unidades corretas; interpretação depende do quadro clínico.']},
{id:'shock',n:'Índice de choque',c:'Hemodinâmica e fórmulas',d:'Relação frequência cardíaca/pressão sistólica.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=shock+index+clinical',f:[['hr','Frequência cardíaca (bpm)','num',100,20,250],['sbp','PAS (mmHg)','num',110,30,300]],x:v=>{let s=v.hr/v.sbp;return[s.toFixed(2),s>=1?'Índice elevado: avaliar instabilidade no contexto clínico':'Interpretar junto à perfusão e ao contexto','Não é diagnóstico isolado; valores podem ser alterados por medicamentos, idade e condições basais.']}},
{id:'anion',n:'Ânion gap',c:'Hemodinâmica e fórmulas',d:'Calcula ânion gap sérico sem potássio.',u:'https://www.ncbi.nlm.nih.gov/books/NBK539757/',f:[['na','Sódio (mEq/L)','num',140,80,200],['cl','Cloreto (mEq/L)','num',104,30,180],['hco','Bicarbonato (mEq/L)','num',24,1,60],['alb','Albumina (g/dL)','num',4,0.1,8]],x:v=>{let s=v.na-v.cl-v.hco,adj=s+2.5*(4-v.alb);return[s.toFixed(1)+' mEq/L · corrigido '+adj.toFixed(1),'Ânion gap e correção por albumina','Intervalos dependem do laboratório. Não substitui análise completa do distúrbio ácido-base.']}},
{id:'na',n:'Sódio corrigido pela glicemia',c:'Hemodinâmica e fórmulas',d:'Estima correção do sódio na hiperglicemia.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=corrected+sodium+hyperglycemia+Katz',f:[['na','Sódio medido (mEq/L)','num',130,80,180],['glu','Glicemia (mg/dL)','num',300,20,1500]],x:v=>{let s=v.na+1.6*((v.glu-100)/100),s2=v.na+2.4*((v.glu-100)/100);return[s.toFixed(1)+' (fator 1,6) · '+s2.toFixed(1)+' (fator 2,4)','Sódio corrigido estimado','Fatores variam conforme grau de hiperglicemia e referência. Planeje correção com monitorização clínica/laboratorial.']}},
{id:'ca',n:'Cálcio corrigido pela albumina',c:'Hemodinâmica e fórmulas',d:'Estimativa convencional do cálcio total corrigido.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=corrected+calcium+albumin+formula',f:[['ca','Cálcio total (mg/dL)','num',8.5,1,20],['alb','Albumina (g/dL)','num',3.5,0.1,8]],x:v=>{let s=v.ca+0.8*(4-v.alb);return[s.toFixed(2)+' mg/dL','Cálcio corrigido estimado','Fórmula pode ser imprecisa em doença crítica/renal; considere cálcio ionizado quando indicado.']}},
{id:'fena',n:'Fração de excreção de sódio (FENa)',c:'Hemodinâmica e fórmulas',d:'Calcula FENa usando sódio e creatinina séricos e urinários.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=fractional+excretion+sodium+formula',f:[['una','Na urinário (mEq/L)','num',30,1,300],['pna','Na plasmático (mEq/L)','num',140,80,200],['ucr','Creatinina urinária (mg/dL)','num',100,1,1000],['pcr','Creatinina plasmática (mg/dL)','num',2,0.1,20]],x:v=>{let s=v.una*v.pcr/(v.pna*v.ucr)*100;return[s.toFixed(2)+'%','FENa estimada','Diuréticos, DRC, sepse e outras condições limitam a interpretação; não use isoladamente para classificar lesão renal.']}},
{id:'ava',n:'Área valvar aórtica — continuidade',c:'Ecocardiografia',d:'Calcula área valvar aórtica com área do TSVI e VTI.',u:'https://www.asecho.org/',f:[['d','Diâmetro do TSVI (cm)','num',2,0.5,4],['lvti','VTI do TSVI (cm)','num',20,1,60],['aviti','VTI aórtico (cm)','num',80,5,200]],x:v=>{let s=Math.PI*Math.pow(v.d/2,2)*v.lvti/v.aviti;return[s.toFixed(2)+' cm²','Área valvar aórtica estimada','Medições ecocardiográficas e alinhamento Doppler são críticos. Integrar gradiente, velocidade e contexto clínico.']}},
{id:'cha2va',n:'CHA₂DS₂-VA',c:'Risco e prevenção',d:'Escore europeu para risco tromboembólico na fibrilação atrial, sem pontuação por sexo.',u:'https://www.escardio.org/Guidelines',f:[['age','Idade','sel','0',['0|<65 anos (0)','1|65–74 anos (1)','2|≥75 anos (2)']],['hf','Insuficiência cardíaca','check'],['htn','Hipertensão','check'],['dm','Diabetes','check'],['stroke','AVC/AIT/embolia sistêmica prévia (2 pontos)','check'],['vasc','Doença vascular','check']],x:v=>{let s=+v.age+(v.hf?1:0)+(v.htn?1:0)+(v.dm?1:0)+(v.stroke?2:0)+(v.vasc?1:0);return[s+'/8',s===0?'Risco tromboembólico baixo pela pontuação':s===1?'Risco aumentado: considerar anticoagulação conforme diretriz':'Risco aumentado: anticoagulação geralmente recomendada conforme diretriz','']}},{id:'h2fpef',n:'H₂FPEF Score',c:'Insuficiência cardíaca',d:'Estima probabilidade de insuficiência cardíaca com fração de ejeção preservada em dispneia inexplicada.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=H2FPEF+score',f:[['bmi','IMC >30 kg/m²','check'],['htn','Uso de ≥2 anti-hipertensivos','check'],['af','Fibrilação atrial','check'],['pasp','Pressão sistólica pulmonar >35 mmHg','check'],['age','Idade >60 anos','check'],['e','E/e’ >9','check']],x:v=>{let s=(v.bmi?2:0)+(v.htn?1:0)+(v.af?3:0)+(v.pasp?1:0)+(v.age?1:0)+(v.e?1:0);return[s+'/9',s<=1?'Baixa probabilidade de ICFEp':s<=5?'Probabilidade intermediária de ICFEp':'Alta probabilidade de ICFEp','']}},{id:'orbit',n:'ORBIT — sangramento',c:'Risco e prevenção',d:'Escore de sangramento em pacientes com fibrilação atrial sob anticoagulação.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=ORBIT+bleeding+score',f:[['age','Idade ≥75 anos','check'],['anemia','Anemia ou hemoglobina baixa','check'],['bleed','Sangramento prévio','check'],['kidney','Função renal reduzida (eGFR <60)','check'],['antiplatelet','Uso de antiagregante','check']],x:v=>{let s=(v.age?1:0)+(v.anemia?2:0)+(v.bleed?2:0)+(v.kidney?1:0)+(v.antiplatelet?1:0);return[s+'/7',s<=2?'Baixo risco de sangramento':s<=3?'Risco intermediário de sangramento':'Alto risco de sangramento','']}},{id:'atria',n:'ATRIA — sangramento',c:'Risco e prevenção',d:'Estratificação de risco de sangramento em fibrilação atrial.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=ATRIA+bleeding+risk+score',f:[['anemia','Anemia','check'],['kidney','Doença renal grave','check'],['age','Idade ≥75 anos','check'],['bleed','Sangramento prévio','check'],['htn','Hipertensão','check']],x:v=>{let s=(v.anemia?3:0)+(v.kidney?3:0)+(v.age?2:0)+(v.bleed?1:0)+(v.htn?1:0);return[s+' pontos',s<=3?'Baixo risco de sangramento':s<=4?'Risco intermediário de sangramento':'Alto risco de sangramento','']}},{id:'pesi',n:'PESI — embolia pulmonar',c:'Tromboembolismo',d:'Índice prognóstico completo para embolia pulmonar aguda.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=PESI+pulmonary+embolism+severity+index',f:[['age','Idade (anos)','num',65,18,120],['male','Sexo masculino','check'],['cancer','Câncer','check'],['hf','Insuficiência cardíaca','check'],['lung','Doença pulmonar crônica','check'],['hr','FC ≥110 bpm','check'],['sbp','PAS <100 mmHg','check'],['rr','FR ≥30/min','check'],['temp','Temperatura <36 °C','check'],['mental','Alteração do estado mental','check'],['sat','SpO₂ <90%','check']],x:v=>{let s=v.age+(v.male?10:0)+(v.cancer?30:0)+(v.hf?10:0)+(v.lung?10:0)+(v.hr?20:0)+(v.sbp?30:0)+(v.rr?20:0)+(v.temp?20:0)+(v.mental?60:0)+(v.sat?20:0);return[s+' pontos',s<=65?'Classe I — baixo risco (PESI ≤65)':s<=85?'Classe II — baixo risco (66–85)':s<=105?'Classe III — risco intermediário (86–105)':s<=125?'Classe IV — alto risco (106–125)':'Classe V — alto risco (>125)','']}},{id:'scai',n:'Estágio SCAI do choque',c:'Hemodinâmica e fórmulas',d:'Classificação clínica de gravidade do choque cardiogênico.',u:'https://www.scai.org/',f:[['stage','Estágio clínico','sel','A',['A|A — em risco','B|B — início','C|C — clássico','D|D — deteriorando','E|E — extremo']],['arrest','Parada cardíaca modificadora','check']],x:v=>{let labels={A:'Estágio A — em risco, sem choque estabelecido',B:'Estágio B — início: hipotensão/taquicardia sem hipoperfusão clara',C:'Estágio C — choque clássico com hipoperfusão e necessidade de intervenção',D:'Estágio D — deterioração apesar da intervenção inicial',E:'Estágio E — colapso circulatório extremo'};return[v.stage+(v.arrest?' + modificador de parada':''),labels[v.stage],'']}},{id:'sts',n:'STS — risco cirúrgico cardíaco',c:'Cirurgia cardiovascular',d:'Estimativa de risco operatório em cirurgia cardíaca. O modelo vigente é atualizado periodicamente e seus coeficientes completos não são disponibilizados publicamente para reprodução independente.',u:'',f:[],x:v=>['Sem estimativa calculada','Modelo não reproduzido localmente','Para evitar um resultado enganoso, este site não substitui o modelo estatístico atual da STS por uma aproximação. Não há redirecionamento para ferramenta externa.']},{id:'syntax',n:'SYNTAX Score',c:'Cirurgia cardiovascular',d:'Pontuação anatômica da complexidade da doença coronariana. A versão completa exige identificar segmentos coronarianos, lesões e características anatômicas em angiografia.',u:'',f:[],x:v=>['Sem pontuação calculada','Mapeamento anatômico completo necessário','A pontuação depende de múltiplas regras por lesão e segmento coronariano. Sem um mapeamento angiográfico completo, não seria correto apresentar uma pontuação parcial como SYNTAX completo. Não há redirecionamento externo.']},{id:'hfaPeff',n:'HFA-PEFF Score',c:'Insuficiência cardíaca',d:'Escore diagnóstico de IC com fração de ejeção preservada a partir de critérios ecocardiográficos e laboratoriais.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=HFA-PEFF+score',f:[['func','Critérios funcionais maiores (2 pontos)','sel','0',['0|Nenhum (0)','1|Menor (1)','2|Maior (2)']],['morph','Critérios morfológicos maiores (2 pontos)','sel','0',['0|Nenhum (0)','1|Menor (1)','2|Maior (2)']],['bio','Critérios de peptídeos natriuréticos maiores (2 pontos)','sel','0',['0|Nenhum (0)','1|Menor (1)','2|Maior (2)']]],x:v=>{let s=+v.func+ +v.morph+ +v.bio;return[s+'/6',s<=1?'ICFEp improvável':s<=4?'Pontuação intermediária: investigação funcional adicional':'ICFEp provável'] }},
{id:'duke',n:'Duke Treadmill Score',c:'Teste ergométrico',d:'Estratificação prognóstica a partir do tempo de exercício, desvio do ST e angina durante esforço.',u:'https://pubmed.ncbi.nlm.nih.gov/?term=Duke+treadmill+score',f:[['time','Tempo de exercício (min)','num',9,0,30],['st','Desvio máximo do ST (mm)','num',0,0,10],['ang','Índice de angina','sel','0',['0|Sem angina (0)','1|Angina não limitante (1)','2|Angina limitante (2)']]],x:v=>{let s=v.time-5*v.st-4*v.ang;return[s.toFixed(1)+' pontos',s>=5?'Baixo risco prognóstico':s>=-10?'Risco intermediário':'Alto risco prognóstico'] }},
{id:'timistemi',n:'TIMI — IAM com supra',c:'Síndrome coronariana',d:'Escore prognóstico de mortalidade em 30 dias no IAM com supradesnivelamento do ST.',u:'https://pubmed.ncbi.nlm.nih.gov/10979111/',f:[['age','Idade','sel','0',['0|<65 anos (0)','2|65–74 anos (+2)','3|≥75 anos (+3)']],['sbp','Pressão sistólica','sel','0',['0|≥100 mmHg (0)','3|<100 mmHg (+3)']],['hr','Frequência cardíaca','sel','0',['0|≤100 bpm (0)','2|>100 bpm (+2)']],['killip','Killip II–IV','check'],['weight','Peso <67 kg','check'],['anterior','IAM anterior ou BRE','check'],['risk','Diabetes, hipertensão ou angina prévia','check'],['delay','Tempo até tratamento >4 h','check']],x:v=>{let s=+v.age+(v.sbp==='3'?3:0)+(v.hr==='2'?2:0)+(v.killip?2:0)+(v.weight?1:0)+(v.anterior?1:0)+(v.risk?1:0)+(v.delay?1:0);let m={0:'0,8%',1:'1,6%',2:'2,2%',3:'4,4%',4:'7,3%',5:'12,4%',6:'16,1%',7:'23,4%',8:'26,8%'};return[s+' pontos','Mortalidade em 30 dias estimada: '+(m[s]||'35,9% (≥9 pontos)'),'Estimativas da coorte original TIMI STEMI; use como prognóstico e não como decisão terapêutica isolada.'] }},
{id:'precisedapt',n:'PRECISE-DAPT',c:'Risco e prevenção',d:'Escore de sangramento com cinco variáveis para apoiar a duração da dupla antiagregação após ICP.',u:'https://pubmed.ncbi.nlm.nih.gov/28290994/',f:[['age','Idade (anos)','num',65,18,110],['crcl','Clearance de creatinina (mL/min)','num',90,0,200],['hb','Hemoglobina (g/dL)','num',13,3,25],['wbc','Leucócitos (10³/µL)','num',7,0.1,100],['bleed','Sangramento espontâneo prévio','check']],x:v=>{let a=Math.max(50,Math.min(90,v.age)),c=Math.max(0,Math.min(100,v.crcl)),h=Math.max(10,Math.min(12,v.hb)),w=Math.max(5,Math.min(20,v.wbc));let s=Math.round((a-50)*19/40+(100-c)*25/100+(12-h)*7.5+(w-5)*1+(v.bleed?26:0));s=Math.max(0,Math.min(100,s));return[s+'/100',s>=25?'≥25: alto risco de sangramento':'<25: sem classificação de alto risco pelo corte PRECISE-DAPT','Estimativa por interpolação linear dos pontos de referência do nomograma publicado. O clearance deve ser calculado separadamente; não é eGFR.']}},
{id:'euroscore',n:'EuroSCORE II',c:'Cirurgia cardiovascular',d:'Modelo logístico para estimar mortalidade hospitalar após cirurgia cardíaca. A implementação exige todas as variáveis e coeficientes exatos do modelo original.',u:'',f:[],x:v=>['Sem estimativa calculada','Modelo completo ainda não implementado','Para não fornecer uma porcentagem potencialmente incorreta, esta versão não estima risco EuroSCORE II. Não há redirecionamento para calculadora externa.']}
];
const $=id=>document.getElementById(id);let category='Todas',current=null;
const cats=['Todas',...new Set(D.map(x=>x.c))];
function renderCats(){ $('cats').innerHTML=cats.map(c=>'<button class="chip '+(c===category?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCats();renderCards()})}
function renderTypes(){ $('type').innerHTML='<option value="all">Todas as áreas</option>'+cats.slice(1).map(c=>'<option>'+c+'</option>').join('')}
function renderCards(){let q=$('search').value.toLowerCase(),type=$('type').value;let arr=D.filter(s=>(category==='Todas'||s.c===category)&&(type==='all'||s.c===type)&&(s.n+' '+s.c+' '+s.d).toLowerCase().includes(q));$('count').textContent=arr.length+' calculadoras';$('cards').innerHTML=arr.map(s=>'<article class="card"><div class="tag">'+s.c+'</div><h3>'+s.n+'</h3><p>'+s.d+'</p><button class="btn" data-open="'+s.id+'">Abrir calculadora →</button></article>').join('');$('empty').classList.toggle('hidden',arr.length>0);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCalc(b.dataset.open))}
function openCalc(id){current=D.find(s=>s.id===id);$('library').classList.add('hidden');$('calc').classList.remove('hidden');$('category').textContent=current.c;$('title').textContent=current.n;$('desc').textContent=current.d;$('result').innerHTML='';$('ref').href=current.u;$('ref').classList.toggle('hidden',!current.u);$('fields').innerHTML=current.f.map(f=>{if(f[2]==='check')return '<label class="check"><input type="checkbox" data-key="'+f[0]+'"><span>'+f[1]+'</span></label>';if(f[2]==='sel')return '<div class="field"><label>'+f[1]+'</label><select data-key="'+f[0]+'">'+f[4].map(o=>{let z=o.split('|');return '<option value="'+z[0]+'" '+(z[0]===String(f[3])?'selected':'')+'>'+z[1]+'</option>'}).join('')+'</select></div>';return '<div class="field"><label>'+f[1]+'</label><input data-key="'+f[0]+'" type="number" min="'+f[4]+'" max="'+f[5]+'" step="any" value="'+f[3]+'"></div>'}).join('');window.scrollTo({top:0,behavior:'smooth'})}
function calculate(){let v={};for(let f of current.f){let e=document.querySelector('[data-key="'+f[0]+'"]');v[f[0]]=f[2]==='check'?e.checked:f[2]==='num'?Number(e.value):e.value;if(f[2]==='num'&&(!e.value||!Number.isFinite(v[f[0]])||v[f[0]]<f[4]||v[f[0]]>f[5])){$('result').innerHTML='<div class="result">Confira o campo '+f[1]+' e informe um valor válido.</div>';return}}let [score,title]=current.x(v);$('result').innerHTML='<div class="result"><div class="tag">Resultado</div><div class="score">'+score+'</div><h3>'+title+'</h3></div>'}
$('run').onclick=calculate;$('reset').onclick=()=>openCalc(current.id);$('back').onclick=()=>{$('calc').classList.add('hidden');$('library').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};$('search').oninput=renderCards;$('type').onchange=renderCards;renderTypes();renderCats();renderCards();
</script></body></html>
